<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>正在跳转...</title>

  <!-- 方法一：meta 刷新（0 秒后跳转） -->
  <meta http-equiv="refresh" content="0; url=https://share.feijipan.com/s/lAxHFb16">

  <!-- 方法二：JS 跳转（优先执行，replace 不留下历史记录） -->
  <script>
    window.location.replace("https://share.feijipan.com/s/lAxHFb16");
  </script>
</head>
<body>
  <p>正在跳转到新网站…如果没有自动跳转，请
    <a href="https://share.feijipan.com/s/lAxHFb16">点击这里</a>。
  </p>
</body>
</html>
